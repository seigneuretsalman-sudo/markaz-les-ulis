<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markaz Les Ulis</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
button,input{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef5ff,#f7f9fc)}
.loginbox{width:min(430px,100%);background:white;padding:34px;border-radius:22px;box-shadow:0 15px 45px #14213d18}
.brand{text-align:center;font-size:28px;font-weight:800;margin-bottom:8px}.brand span{color:#2563eb}.sub{text-align:center;color:#718096;margin-bottom:28px}
label{display:block;font-size:14px;font-weight:700;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #dce3ed;border-radius:10px;outline:0}input:focus{border-color:#2563eb}
.primary{width:100%;border:0;border-radius:10px;padding:14px;background:#2563eb;color:white;font-weight:700;margin-top:20px;cursor:pointer}
.demo{margin-top:18px;padding:12px;background:#f4f7fb;border-radius:10px;color:#64748b;font-size:13px;line-height:1.5}
.error{color:#dc2626;font-size:13px;margin-top:10px;display:none}
.app{display:none;min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:245px;background:#fff;border-right:1px solid #e6ebf2;padding:24px 16px}.logo{font-size:21px;font-weight:800;margin:5px 12px 28px}.logo span{color:#2563eb}
.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;margin:3px 0;border-radius:10px;color:#536176;cursor:pointer}.nav button:hover,.nav button.active{background:#eaf1ff;color:#2563eb;font-weight:700}
.main{margin-left:245px;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{margin:0}.top p{margin:6px 0;color:#718096}.profile{display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e8edf4;border-radius:15px;padding:20px;box-shadow:0 3px 12px #152a4d08}.stat small{color:#718096}.stat strong{display:block;font-size:26px;margin-top:7px}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:20px}.section{margin-top:20px}.row{padding:13px 0;border-bottom:1px solid #edf0f5}.row:last-child{border:0}.time{color:#2563eb;font-weight:bold;margin-right:14px}.badge{float:right;background:#edf4ff;color:#2563eb;padding:5px 9px;border-radius:20px;font-size:12px}
.page{display:none}.page.active{display:block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid #edf0f5}th{font-size:13px;color:#68768b}
.logout{margin-top:18px;width:100%;border:1px solid #e1e6ee;background:white;border-radius:10px;padding:10px;cursor:pointer;color:#dc2626}
@media(max-width:800px){.side{width:68px;padding:18px 7px}.logo{font-size:0;text-align:center}.logo span{font-size:21px}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:20px}.main{margin-left:68px;padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top h1{font-size:22px}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="loginbox">
    <div class="brand">Markaz <span>Les Ulis</span></div>
    <div class="sub">Connexion à votre espace</div>
    <label>Identifiant</label>
    <input id="user" placeholder="Votre identifiant">
    <label>Mot de passe</label>
    <input id="pass" type="password" placeholder="Votre mot de passe">
    <div id="error" class="error">Identifiant ou mot de passe incorrect.</div>
    <button class="primary" onclick="login()">Se connecter</button>
    <div class="demo">
      <b>Comptes de démonstration</b><br>
      Élève : <b>eleve</b> / <b>1234</b><br>
      Professeur : <b>prof</b> / <b>1234</b><br>
      Administrateur : <b>admin</b> / <b>1234</b>
    </div>
  </div>
</div>

<div id="app" class="app">
<aside class="side">
  <div class="logo">Markaz <span>Les Ulis</span></div>
  <div id="nav" class="nav"></div>
  <button class="logout" onclick="logout()">Déconnexion</button>
</aside>
<main class="main">
  <div class="top">
    <div><h1 id="title">Tableau de bord</h1><p id="subtitle"></p></div>
    <div class="profile"><span id="roleName"></span><div class="avatar" id="avatar">A</div></div>
  </div>
  <div id="content"></div>
</main>
</div>

<script>
let role='',name='';
const menus={
eleve:[['accueil','🏠 Accueil'],['emploi','📅 Emploi du temps'],['notes','📝 Notes'],['devoirs','📚 Devoirs'],['absences','❌ Absences'],['messages','💬 Messagerie'],['documents','📄 Documents']],
prof:[['accueil','🏠 Accueil'],['classes','👨‍🎓 Mes classes'],['notes','📝 Notes'],['devoirs','📚 Devoirs'],['absences','❌ Absences'],['emploi','📅 Emploi du temps'],['annonces','📢 Annonces']],
admin:[['accueil','🏠 Accueil'],['eleves','👨‍🎓 Élèves'],['professeurs','👨‍🏫 Professeurs'],['classes','🏫 Classes'],['emploi','📅 Emploi du temps'],['annonces','📢 Annonces'],['documents','📄 Documents']]
};
function login(){
 const u=document.getElementById('user').value.trim().toLowerCase(),p=document.getElementById('pass').value;
 if(p!=='1234'||!['eleve','prof','admin'].includes(u)){document.getElementById('error').style.display='block';return}
 role=u; name=u==='eleve'?'Ahmed':u==='prof'?'M. Benali':'Administration';
 document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';
 document.getElementById('roleName').textContent=name;document.getElementById('avatar').textContent=name[0];
 buildNav();show('accueil');
}
function buildNav(){document.getElementById('nav').innerHTML=menus[role].map(x=>`<button id="b-${x[0]}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
function show(page){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
 const b=document.getElementById('b-'+page);if(b)b.classList.add('active');
 const titles={accueil:'Tableau de bord',emploi:'Emploi du temps',notes:'Notes',devoirs:'Devoirs',absences:'Absences & retards',messages:'Messagerie',documents:'Documents',classes:'Mes classes',eleves:'Gestion des élèves',professeurs:'Gestion des professeurs',annonces:'Annonces'};
 document.getElementById('title').textContent=titles[page]||'Markaz Les Ulis';
 document.getElementById('subtitle').textContent=role==='eleve'?'Bienvenue dans ton espace Markaz Les Ulis':'Espace '+(role==='prof'?'professeur':'administrateur')+' — Markaz Les Ulis';
 let c='';
 if(page==='accueil'&&role==='eleve') c=`<div class="grid"><div class="card stat"><small>Moyenne générale</small><strong>15,2/20</strong></div><div class="card stat"><small>Devoirs</small><strong>3</strong></div><div class="card stat"><small>Absences</small><strong>1</strong></div><div class="card stat"><small>Messages</small><strong>2</strong></div></div><div class="two"><div class="card"><h2>📅 Prochains cours</h2><div class="row"><span class="time">18:00</span>Arabe <span class="badge">Salle 2</span></div><div class="row"><span class="time">19:30</span>Coran <span class="badge">Salle 1</span></div><div class="row"><span class="time">20:30</span>Tajwid <span class="badge">Salle 3</span></div></div><div class="card"><h2>📚 Devoirs</h2><div class="row">Réviser sourate Al-Baqara <span class="badge">Demain</span></div><div class="row">Exercice de tajwid <span class="badge">30 sept.</span></div></div></div>`;
 else if(page==='accueil') c=`<div class="grid"><div class="card stat"><small>Élèves</small><strong>124</strong></div><div class="card stat"><small>Professeurs</small><strong>12</strong></div><div class="card stat"><small>Cours aujourd'hui</small><strong>18</strong></div><div class="card stat"><small>Annonces</small><strong>3</strong></div></div><div class="card section"><h2>📢 Activité récente</h2><div class="row">Nouvelle annonce publiée</div><div class="row">Cours de samedi modifié</div></div>`;
 else if(page==='notes') c=`<div class="card"><h2>📝 Notes</h2><table><tr><th>Matière</th><th>Note</th><th>Coefficient</th></tr><tr><td>Arabe</td><td>16/20</td><td>2</td></tr><tr><td>Coran</td><td>15/20</td><td>2</td></tr><tr><td>Tajwid</td><td>14/20</td><td>1</td></tr></table></div>`;
 else if(page==='emploi') c=`<div class="card"><h2>📅 Emploi du temps</h2><table><tr><th>Heure</th><th>Lundi</th><th>Mardi</th><th>Mercredi</th><th>Samedi</th></tr><tr><td>18h00</td><td>Arabe</td><td>—</td><td>Coran</td><td>Arabe</td></tr><tr><td>19h30</td><td>Tajwid</td><td>Arabe</td><td>—</td><td>Coran</td></tr></table></div>`;
 else if(page==='devoirs') c=`<div class="card"><h2>📚 Devoirs</h2><div class="row">Réviser sourate Al-Baqara <span class="badge">Demain</span></div><div class="row">Exercice de tajwid <span class="badge">30 sept.</span></div><div class="row">Lecture arabe <span class="badge">2 oct.</span></div></div>`;
 else if(page==='absences') c=`<div class="card"><h2>❌ Absences & retards</h2><div class="row">15 septembre — Absence justifiée</div><div class="row">Total : <b>1 absence</b></div></div>`;
 else if(page==='messages') c=`<div class="card"><h2>💬 Messagerie</h2><div class="row"><b>Professeur d'arabe :</b> N'oublie pas ton exercice.</div><div class="row"><b>Administration :</b> Votre inscription est validée.</div></div>`;
 else if(page==='documents') c=`<div class="card"><h2>📄 Documents</h2><div class="row">📄 Règlement intérieur</div><div class="row">📄 Calendrier 2026-2027</div><div class="row">📄 Programme des cours</div></div>`;
 else if(page==='classes') c=`<div class="card"><h2>🏫 Classes</h2><div class="row">Niveau 1 — 28 élèves</div><div class="row">Niveau 2 — 31 élèves</div><div class="row">Niveau 3 — 25 élèves</div></div>`;
 else if(page==='eleves') c=`<div class="card"><h2>👨‍🎓 Élèves</h2><div class="row">Ahmed — Niveau 2</div><div class="row">Yassine — Niveau 1</div><div class="row">Ibrahim — Niveau 3</div></div>`;
 else if(page==='professeurs') c=`<div class="card"><h2>👨‍🏫 Professeurs</h2><div class="row">M. Benali — Arabe</div><div class="row">M. Karim — Coran</div><div class="row">M. Youssef — Tajwid</div></div>`;
 else if(page==='annonces') c=`<div class="card"><h2>📢 Annonces</h2><div class="row">Cours de samedi à 14h00.</div><div class="row">Réunion parents vendredi à 19h00.</div></div>`;
 else c=`<div class="card"><h2>${titles[page]||'Page'}</h2><p>Cette section est prête à être reliée à la base de données.</p></div>`;
 document.getElementById('content').innerHTML=c;
}
function logout(){role='';document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid';document.getElementById('user').value='';document.getElementById('pass').value='';}
</script>
</body>
</html>
