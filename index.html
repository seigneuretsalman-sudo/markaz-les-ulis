<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Markaz Les Ulis</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #f4f7fb;
color: #172033;
}

.container {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}

.box {
width: 100%;
max-width: 430px;
background: white;
padding: 32px;
border-radius: 22px;
box-shadow: 0 10px 30px rgba(0,0,0,.08);
}

.logo {
text-align: center;
font-size: 28px;
font-weight: 800;
margin-bottom: 8px;
}

.logo span {
color: #2563eb;
}

.subtitle {
text-align: center;
color: #64748b;
margin-bottom: 25px;
}

input,
select {
width: 100%;
padding: 13px;
margin-top: 7px;
margin-bottom: 15px;
border: 1px solid #dbe1e8;
border-radius: 10px;
font-size: 15px;
}

label {
font-size: 14px;
font-weight: bold;
}

button {
width: 100%;
padding: 14px;
border: 0;
border-radius: 10px;
background: #2563eb;
color: white;
font-weight: bold;
font-size: 15px;
cursor: pointer;
}

.secondary {
background: transparent;
color: #2563eb;
margin-top: 10px;
}

.error {
color: #dc2626;
margin-top: 12px;
font-size: 14px;
}

.success {
color: #16a34a;
margin-top: 12px;
font-size: 14px;
}

.hidden {
display: none;
}

.dashboard {
min-height: 100vh;
padding: 25px;
}

.header {
max-width: 900px;
margin: auto;
display: flex;
justify-content: space-between;
align-items: center;
}

.logout {
width: auto;
background: #ef4444;
padding: 10px 16px;
}

.profile {
max-width: 900px;
margin: 30px auto;
background: white;
padding: 30px;
border-radius: 20px;
box-shadow: 0 8px 25px rgba(0,0,0,.06);
}

.profile h2 {
margin-top: 0;
}

.info {
background: #f4f7fb;
padding: 15px;
border-radius: 12px;
margin-top: 12px;
}
</style>
</head>

<body>

<!-- CONNEXION -->
<div id="loginPage" class="container">

<div class="box">

<div class="logo">
Markaz <span>Les Ulis</span>
</div>

<div class="subtitle">
Espace élève
</div>

<div id="loginForm">

<label>Email</label>
<input
id="loginEmail"
type="email"
placeholder="exemple@email.com"
>

<label>Mot de passe</label>
<input
id="loginPassword"
type="password"
placeholder="Mot de passe"
>

<button onclick="login()">
Se connecter
</button>

<button class="secondary" onclick="showSignup()">
Créer un compte
</button>

<div id="loginMessage"></div>

</div>


<!-- INSCRIPTION -->

<div id="signupForm" class="hidden">

<label>Prénom</label>
<input
id="prenom"
type="text"
placeholder="Prénom"
>

<label>Nom</label>
<input
id="nom"
type="text"
placeholder="Nom"
>

<label>Classe</label>
<input
id="classe"
type="text"
placeholder="Exemple : 3ème A"
>

<label>Email</label>
<input
id="signupEmail"
type="email"
placeholder="exemple@email.com"
>

<label>Mot de passe</label>
<input
id="signupPassword"
type="password"
placeholder="Minimum 6 caractères"
>

<button onclick="signup()">
Créer mon compte
</button>

<button class="secondary" onclick="showLogin()">
J'ai déjà un compte
</button>

<div id="signupMessage"></div>

</div>

</div>

</div>


<!-- ESPACE UTILISATEUR -->

<div id="dashboard" class="dashboard hidden">

<div class="header">

<div>
<h1>Markaz Les Ulis</h1>
<p>Espace personnel</p>
</div>

<button class="logout" onclick="logout()">
Déconnexion
</button>

</div>


<div class="profile">

<h2>Bienvenue 👋</h2>

<div class="info">
<strong>Prénom :</strong>
<span id="profilePrenom"></span>
</div>

<div class="info">
<strong>Nom :</strong>
<span id="profileNom"></span>
</div>

<div class="info">
<strong>Classe :</strong>
<span id="profileClasse"></span>
</div>

<div class="info">
<strong>Email :</strong>
<span id="profileEmail"></span>
</div>

</div>

</div>


<script>

// ============================================
// SUPABASE
// ============================================

const SUPABASE_URL =
"https://wbtmrsatqmgqfkiiuor.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"COLLE_ICI_TA_CLE_SB_PUBLISHABLE";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


// ============================================
// AFFICHAGE
// ============================================

function showSignup() {

document
.getElementById("loginForm")
.classList.add("hidden");

document
.getElementById("signupForm")
.classList.remove("hidden");
}


function showLogin() {

document
.getElementById("signupForm")
.classList.add("hidden");

document
.getElementById("loginForm")
.classList.remove("hidden");
}


// ============================================
// CREER UN COMPTE
// ============================================

async function signup() {

const prenom =
document.getElementById("prenom").value.trim();

const nom =
document.getElementById("nom").value.trim();

const classe =
document.getElementById("classe").value.trim();

const email =
document.getElementById("signupEmail").value.trim();

const password =
document.getElementById("signupPassword").value;


const message =
document.getElementById("signupMessage");


message.className = "";


if (!prenom || !nom || !classe || !email || !password) {

message.textContent =
"Remplis tous les champs.";

message.className = "error";

return;
}


if (password.length < 6) {

message.textContent =
"Le mot de passe doit contenir au moins 6 caractères.";

message.className = "error";

return;
}


const { data, error } =
await supabaseClient.auth.signUp({

email: email,

password: password,

options: {

data: {
prenom: prenom,
nom: nom,
classe: classe
}

}

});


if (error) {

message.textContent =
error.message;

message.className = "error";

return;
}


message.textContent =
"Compte créé ! Vérifie ton email si Supabase te le demande.";

message.className = "success";

}


// ============================================
// CONNEXION
// ============================================

async function login() {

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;


const message =
document.getElementById("loginMessage");


message.className = "";


const { data, error } =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});


if (error) {

message.textContent =
"Email ou mot de passe incorrect.";

message.className = "error";

return;
}


chargerProfil(data.user);

}


// ============================================
// PROFIL
// ============================================

async function chargerProfil(user) {

const { data: profil } =
await supabaseClient
.from("profiles")
.select("*")
.eq("id", user.id)
.single();


if (!profil) {

alert("Profil introuvable.");

return;
}


document
.getElementById("loginPage")
.classList.add("hidden");


document
.getElementById("dashboard")
.classList.remove("hidden");


document.getElementById("profilePrenom")
.textContent = profil.prenom;

document.getElementById("profileNom")
.textContent = profil.nom;

document.getElementById("profileClasse")
.textContent = profil.classe || "Non renseignée";

document.getElementById("profileEmail")
.textContent = user.email;

}


// ============================================
// DECONNEXION
// ============================================

async function logout() {

await supabaseClient.auth.signOut();

document
.getElementById("dashboard")
.classList.add("hidden");

document
.getElementById("loginPage")
.classList.remove("hidden");
}


// ============================================
// SESSION EXISTANTE
// ============================================

async function checkSession() {

const {
data: { session }
} = await supabaseClient.auth.getSession();


if (session) {

chargerProfil(session.user);

}

}


checkSession();

</script>

</body>
</html>
